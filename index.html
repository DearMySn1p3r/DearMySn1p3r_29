<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Couple Checklist</title>
<link rel="icon" type="image/png" href="MOMO.png">
<link rel="apple-touch-icon" href="MOMO.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--serif:'Instrument Serif',Georgia,serif}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{margin:0 auto}
.sheet{transition:background .4s,border-color .4s}
.p1{--pc:var(--c1);--pb:var(--c1b);--ps:var(--c1s)}
.p2{--pc:var(--c2);--pb:var(--c2b);--ps:var(--c2s)}
.chk.c1{--pc:var(--c1);--pb:var(--c1b);--ps:var(--c1s)}
.chk.c2{--pc:var(--c2);--pb:var(--c2b);--ps:var(--c2s)}
.av-wrap{position:relative;display:inline-block;flex-shrink:0}
.avatar{position:relative;border-radius:50%;overflow:hidden;background:var(--pc);transition:background .3s}
.av-init{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;user-select:none}
.av-img{position:absolute;top:0;left:0;right:0;bottom:0;display:none;touch-action:none;cursor:grab;overflow:hidden;border-radius:50%}
.av-img:active{cursor:grabbing}
.av-img img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none}
.av-edit{position:absolute;right:-3px;bottom:-3px;z-index:3;width:18px;height:18px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s}
.av-edit:hover{color:var(--text)}
.av-edit svg{width:9px;height:9px}
.name{border:none;outline:none;background:transparent;width:100%;display:block}
.name::placeholder{color:var(--faint)}
.swatches{display:flex;gap:7px;align-items:center}
.sw{width:11px;height:11px;border-radius:50%;cursor:pointer;position:relative}
.sw.on::after{content:'';position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:50%;border:1px solid var(--text)}
.sw-custom{position:relative;width:11px;height:11px;border-radius:50%;overflow:hidden;cursor:pointer;border:1px dashed var(--sub)}
.sw-custom input{position:absolute;top:-8px;left:-8px;width:30px;height:30px;opacity:0;cursor:pointer;border:none}
.tr-fill{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.item-t{word-break:keep-all}
.del{width:18px;height:18px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:var(--sub);border:1px solid var(--line)}
.del:hover{color:#C0504D;border-color:#C0504D}
.add-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.add-row input{flex:1;height:34px;padding:0 2px;border:none;border-bottom:1px dashed var(--faint);background:transparent;outline:none;font-size:13px}
.add-row input:focus{border-bottom:1px solid var(--text)}
.add-row button{height:28px;padding:0 12px;border-radius:999px;background:var(--text);color:var(--card);font-size:12px;font-weight:600}
body:not(.editing) .del,body:not(.editing) .add-row{display:none}


.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;padding:4px;border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.06);box-shadow:0 8px 28px -10px rgba(0,0,0,.22)}
.d-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:500;color:#4a4648;white-space:nowrap;transition:background .15s,color .15s}
.d-btn svg{width:15px;height:15px;flex-shrink:0}
.d-btn:hover{background:#F4F2F2;color:#1f1b1c}
.d-btn.active{background:#F1EEEF;color:#1f1b1c}
.d-btn.primary{background:#1f1b1c;color:#fff;padding:0 14px;margin-left:2px}
.d-btn.primary:hover{background:#000}
.d-btn:disabled{opacity:.55;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translate(-50%,6px);opacity:0;pointer-events:none;padding:8px 14px;border-radius:10px;background:rgba(31,27,28,.92);color:#fff;font-size:12px;transition:opacity .2s,transform .2s;z-index:101;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.panel{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));z-index:99;width:min(320px,calc(100vw - 24px));padding:12px 14px 14px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:0 16px 40px -14px rgba(0,0,0,.25);transform:translate(-50%,6px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.panel.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pn-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12.5px;font-weight:600;color:#1f1b1c}
.pn-x{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#9a9496}
.pn-x:hover{background:#F4F2F2;color:#1f1b1c}
.pn-x svg{width:14px;height:14px}
.pn-sec+.pn-sec{margin-top:12px}
.pn-k{font-size:11px;font-weight:500;color:#8f898b;margin-bottom:7px}
.pn-h{color:#b9b3b5;margin-left:3px}
.pn-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pn-row .sw,.pn-row .sw-custom,.gc,.gci{width:20px;height:20px}
.sw.on::after,.gc.on::after{content:'';position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:50%;border:1.5px solid #1f1b1c}
.gc{border-radius:50%;cursor:pointer;position:relative;border:1px solid rgba(0,0,0,.08)}
.gc-none{background:linear-gradient(135deg,transparent 45%,#D8564F 45%,#D8564F 55%,transparent 55%),#fff}
.gcustom{display:flex;align-items:center;gap:5px;margin-left:2px;padding-left:9px;border-left:1px solid #EEE9EA}
.gci{position:relative;border-radius:50%;overflow:hidden;cursor:pointer;border:1px dashed #b9b3b5}
.gci input{position:absolute;top:-8px;left:-8px;width:40px;height:40px;opacity:0;cursor:pointer;border:none}
.gcl{display:none}
.sw-custom{border:1px dashed #b9b3b5}
@media(max-width:420px){.d-btn{padding:0 10px}.d-btn.primary span{display:inline}}
body.capturing{padding:0 !important}
.capturing #capture{padding:24px;background:var(--bg)}
.capturing .sheet{box-shadow:none}

/* ===== Classic Refined ===== */

body{padding:36px 14px 96px}
.wrap{max-width:720px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px -26px rgba(0,0,0,.22)}
.strip{height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}

/* hero */
.hero{padding:26px 32px 22px;border-bottom:1px solid var(--line);transition:background .4s}
.hd{text-align:center}
.hd-e{display:block;font-size:10.5px;letter-spacing:.42em;padding-left:.42em;color:var(--sub)}
.hd-t{display:inline-block;margin-top:2px;padding:0 .12em;font-family:var(--tf);font-style:var(--tst);font-weight:var(--tw);font-size:var(--tz);line-height:1.15;letter-spacing:var(--tls);color:var(--accent);background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.people{display:grid;grid-template-columns:1fr 104px 1fr;margin-top:22px;align-items:start}
.person{display:flex;flex-direction:column;align-items:center;min-width:0}
.av-wrap{padding:3px;border-radius:50%;border:2px solid var(--pc);background:var(--card)}
.avatar{width:76px;height:76px}
.av-init{font-size:26px;font-weight:500}
.av-edit{width:22px;height:22px;right:-2px;bottom:-2px}
.av-edit svg{width:10px;height:10px}
.name{margin-top:12px;max-width:150px;text-align:center;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.3;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.name:focus{border-bottom-color:var(--pc)}
.type{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--pc);letter-spacing:-.01em;min-height:16px}
.type.empty{color:var(--faint);font-weight:400}

.traits{width:100%;max-width:226px;margin-top:10px}
.ax{display:flex;align-items:center;gap:5px;height:19px}
.ax .tr{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.tr-l{font-size:10.5px;color:var(--sub);white-space:nowrap;width:22px}
.ax .r .tr-l{text-align:right}
.tr-v{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;width:26px}
.ax .r .tr-v{text-align:right}
.tr-bar{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
.ax .l .tr-bar{border-radius:9px 0 0 9px}
.ax .r .tr-bar{border-radius:0 9px 9px 0}
.tr-fill{position:absolute;top:0;bottom:0;width:0;background:var(--pc)}
.ax .l .tr-fill{right:0}
.ax .r .tr-fill{left:0}
.ax .tr:not(.best) .tr-fill{opacity:.4}
.tr.best .tr-l{color:var(--text);font-weight:600}
.tr.best .tr-v{color:var(--pc);font-weight:600}

.mid{display:flex;flex-direction:column;align-items:center;padding-top:30px}
.x{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;line-height:1;color:var(--faint)}
.sync{margin-top:12px;font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;line-height:1;color:var(--text)}
.sync small{font-size:13px;color:var(--sub);margin-left:1px}
.sync-k{margin-top:6px;font-size:8.5px;letter-spacing:.3em;padding-left:.3em;color:var(--sub)}
.same{margin-top:12px;font-size:10.5px;color:var(--sub);white-space:nowrap}
.same b{color:var(--text);font-weight:600}

/* list */
.list{padding:4px 30px 22px}
.cat{margin-top:20px}
.cat-h{display:flex;align-items:center;gap:12px;margin:0 8px 6px}
.cat-t{font-size:10.5px;font-weight:600;letter-spacing:.24em;color:var(--accent);white-space:nowrap}
.cat-line{flex:1;height:1px;background:var(--line)}
.rows{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.item{display:flex;align-items:center;gap:8px;min-height:31px;padding:4px 8px;border-radius:8px;transition:background .2s}
.item:hover{background:var(--soft)}
.item.both{background:var(--soft)}
.item-t{flex:1;font-size:12.5px;color:var(--body);line-height:1.4}
.item.any .item-t{color:var(--text)}
.cks{display:flex;gap:6px}
.chk{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--pc);transition:background .15s,transform .12s}
.chk:not(.on){opacity:.75}
.chk:hover{opacity:1}
.chk.on{background:var(--pc)}
.add-row{grid-column:1/-1;padding:0 8px}
.del{width:16px;height:16px;font-size:11px}

.foot{padding:12px 20px 14px;border-top:1px dashed var(--line);text-align:center;font-size:9.5px;letter-spacing:.32em;padding-left:calc(20px + .32em);color:var(--faint)}

@media(max-width:600px){
  body{padding:12px 8px 90px}
  .sheet{border-radius:16px}
  .hero{padding:22px 12px 18px}
  .hd-t{font-size:calc(var(--tz) * .85)}
  .people{grid-template-columns:1fr 66px 1fr;margin-top:18px}
  .mid{padding-top:26px}
  .sync{font-size:22px}
  .name{font-size:14px}
  .tr-v{display:none}
  .tr-l{font-size:10px;width:20px}
  .list{padding:0 8px 16px}
  .rows{grid-template-columns:1fr}
  .item{min-height:40px}
  .item-t{font-size:13.5px}
  .chk{width:22px;height:22px}
}
.capturing #capture{width:768px}
.capturing .sheet{box-shadow:none}
.capturing .hero{padding:26px 32px 22px}
.capturing .hd-t{font-size:var(--tz)}
.capturing .people{grid-template-columns:1fr 104px 1fr;margin-top:22px}
.capturing .mid{padding-top:30px}
.capturing .sync{font-size:28px}
.capturing .name{font-size:15px}
.capturing .tr-v{display:block}
.capturing .tr-l{font-size:10.5px;width:22px}
.capturing .list{padding:4px 30px 22px}
.capturing .rows{grid-template-columns:1fr 1fr}
.capturing .item{min-height:31px}
.capturing .item-t{font-size:12.5px}
.capturing .chk{width:15px;height:15px}

</style>
</head>
<body>
<main class="wrap">
  <div id="capture">
    <article class="sheet">

      <div class="strip"></div>
      <div class="hero">
        <header class="hd"><p class="hd-e">OUR</p><h1 class="hd-t">Couple Checklist</h1></header>
        <section class="people">
          <div class="person p1" id="person1"></div>
          <div class="mid">
            <span class="x">×</span>
            <div class="sync"><span id="syncNum">–</span><small id="syncPct">%</small></div>
            <span class="sync-k">SYNC</span>
            <span class="same">같은 점 <b id="same">0</b></span>
          </div>
          <div class="person p2" id="person2"></div>
        </section>
      </div>
      <section class="list" id="list"></section>
      <footer class="foot">CHECK TOGETHER</footer>
    </article>
  </div>
</main>
<div class="panel no-cap" id="panel">
  <div class="pn-head"><span>컬러</span><button class="pn-x" id="pnClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pn-sec"><p class="pn-k" id="pk1">A</p><div class="pn-row" id="sw1"></div></div>
  <div class="pn-sec"><p class="pn-k" id="pk2">B</p><div class="pn-row" id="sw2"></div></div>
  <div class="pn-sec"><p class="pn-k">배경 <span class="pn-h" id="gname"></span></p><div class="pn-row" id="pg"></div></div>
</div>
<nav class="dock no-cap">
  <button class="d-btn" id="colorBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>컬러</button>
  <button class="d-btn" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>초기화</button>
  <button class="d-btn primary" id="saveBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>이미지 저장</span></button>
</nav>
<div class="toast no-cap" id="toast"></div>
<script>
const V={
  id:'A3', av:76,  chip:false, empty:'—',
  colors:['#F08FA6','#6FA8F0'],
  palette:['#F29A84','#F08FA6','#C07088','#A894E8','#6FA8F0','#5CC2A2'],
  themes:[{n:'white',bg:'#F4F2F1',card:'#FFFFFF',text:'#2A2422',body:'#4A4240',sub:'#A39893',faint:'#D2C9C6',line:'#F1E6E8',soft:'#FBF6F7',dot:'#F4F2F1',dark:false},{n:'rose',bg:'#FAF0F2',card:'#FFFFFF',text:'#2C2220',body:'#4B3D3E',sub:'#B09898',faint:'#DCC8CC',line:'#F3DFE5',soft:'#FDF5F7',dot:'#FAF0F2',dark:false},{n:'cream',bg:'#F8F4EC',card:'#FFFDF8',text:'#2A251E',body:'#4A433A',sub:'#A69C8E',faint:'#D4CABB',line:'#EFE6D8',soft:'#FAF5EC',dot:'#F8F4EC',dark:false},{n:'night',bg:'#111012',card:'#1C1B1E',text:'#F1EEF0',body:'#D2CDD0',sub:'#8F888C',faint:'#4D484B',line:'#2E2B2E',soft:'#262428',dot:'#1C1B1E',dark:true}],
  person:n=>avatarHTML(n)+nameHTML(n)+typeHTML(n)
    +`<div class="traits">`
    +AXES.map(([a,b])=>`<div class="ax"><div class="tr l" id="tr${n}-${a}"><span class="tr-l">${TRAITS[a].l}</span><span class="tr-v">0%</span><div class="tr-bar"><div class="tr-fill"></div></div></div><div class="tr r" id="tr${n}-${b}"><div class="tr-bar"><div class="tr-fill"></div></div><span class="tr-v">0%</span><span class="tr-l">${TRAITS[b].l}</span></div></div>`).join('')
    +`</div>`,
  fonts:[{n:'Allura', f:"'Allura',cursive", st:'normal', w:400, z:48, ls:'0'}],
  cat:(ci,t,c)=>`<div class="cat-h"><span class="cat-t">${t}</span><span class="cat-line"></span></div>`,
};
/* ================= data ================= */
const TRAITS={
  r:{l:'이성'}, e:{l:'감성'},
  j:{l:'계획'}, p:{l:'즉흥'},
  x:{l:'외향'}, i:{l:'내향'},
};
const TK=Object.keys(TRAITS);
const AXES=[['r','e'],['j','p'],['x','i']];
const DATA=[
  {title:'성격 & 성향',items:[
    ['계획을 꼼꼼히 세우는 사람','j'],['즉흥적으로 결정하는 사람','p'],
    ['감정을 직접 말로 표현하는 사람','e x'],['속마음을 잘 숨기는 사람','i r'],
    ['고집이 센 사람','r'],['완벽주의 성향인 사람','j r'],
    ['걱정이 많은 사람','e j'],['긍정적으로 생각하려는 사람','x'],
    ['눈물이 많은 사람','e'],['웃음이 많은 사람','x e'],
    ['결정을 빨리 내리는 사람','p'],['말보다 행동으로 보여주는 사람','r'],
    ['감정 기복이 있는 편인 사람','e'],['논리적으로 따지는 사람','r'],
    ['공감을 잘해주는 사람','e'],['칭찬에 약한 사람','e'],
  ]},
  {title:'연애 스타일',items:[
    ['먼저 연락하는 사람','x'],['답장이 빠른 사람','x'],
    ['애교가 많은 사람','e x'],['스킨십을 먼저 하는 사람','x'],
    ['기념일을 챙기는 사람','j e'],['질투를 표현하는 사람','e'],
    ['사랑한다는 말을 자주 하는 사람','e'],
    ['먼저 사과하는 사람','e'],['데이트 코스를 짜는 사람','j'],
    ['연락이 끊기면 불안해하는 사람','e'],['계산을 먼저 하는 사람','r'],
  ]},
  {title:'생활 & 취향',items:[
    ['맛집 탐방을 좋아하는 사람','x'],['요리를 해주는 사람','j i'],
    ['여행 계획을 세우는 사람','j'],['아침에 일찍 일어나는 사람','j'],
    ['늦게 자는 사람','p i'],['간식을 달고 사는 사람','p'],
    ['운전을 하는 사람','r'],['술을 잘 마시는 사람','x'],
    ['정리정돈을 잘하는 사람','j r'],['물건을 자주 잃어버리는 사람','p'],

function shade(hex,f){const n=parseInt(hex.slice(1),16);const c=v=>Math.round(Math.min(255,v*f)).toString(16).padStart(2,'0');return '#'+c(n>>16&255)+c(n>>8&255)+c(n&255)}
function updateAccent(){const t=THEMES[state.theme]||{},r=document.documentElement.style;r.setProperty('--accent',t.dark?state.colors[0]:shade(state.colors[0],.8));r.setProperty('--t1',shade(state.colors[0],.9));r.setProperty('--t2',shade(state.colors[1],.9))}

/* ================= photo ================= */
const dims=[null,null];
function loadPhoto(p,file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,600/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      state.photos[p]=c.toDataURL('image/jpeg',.88);
      state.ph[p]={s:1,x:0,y:0};
      renderPhoto(p);persist();
      toast('드래그로 위치, 휠·핀치로 크기 조절');
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(file);
  $('ph'+(p+1)).value='';
}
function renderPhoto(p){
  const n=p+1,url=state.photos[p];
  $('iw'+n).style.display=url?'block':'none';
  $('init'+n).style.display=url?'none':'flex';
  if(url)$('pi'+n).src=url;
}
function computeDims(p){
  const img=$('pi'+(p+1)),nw=img.naturalWidth,nh=img.naturalHeight;if(!nw)return;
  const r=Math.max(AV/nw,AV/nh);dims[p]={w:nw*r,h:nh*r};
  img.style.width=dims[p].w+'px';img.style.height=dims[p].h+'px';
}
function clampPan(p){
  const ph=state.ph[p],d=dims[p];if(!d)return;
  ph.s=Math.min(5,Math.max(1,ph.s));
  const mx=Math.max(0,(d.w*ph.s-AV)/2),my=Math.max(0,(d.h*ph.s-AV)/2);
  ph.x=Math.min(mx,Math.max(-mx,ph.x));ph.y=Math.min(my,Math.max(-my,ph.y));
}
function applyPan(p){
  clampPan(p);const ph=state.ph[p];
  $('pi'+(p+1)).style.transform=`translate(-50%,-50%) translate(${ph.x}px,${ph.y}px) scale(${ph.s})`;
}
function setupPan(p){
  const w=$('iw'+(p+1));const pts=new Map();let lastD=0;
  const dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
  w.addEventListener('pointerdown',e=>{w.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2)lastD=dist()});
  w.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId),cur={x:e.clientX,y:e.clientY};pts.set(e.pointerId,cur);
    const ph=state.ph[p];
    if(pts.size===1){ph.x+=cur.x-prev.x;ph.y+=cur.y-prev.y}
    else if(pts.size===2){const d=dist();if(lastD)ph.s*=d/lastD;lastD=d}
    applyPan(p);
  });
  const end=e=>{pts.delete(e.pointerId);lastD=pts.size===2?dist():0;persist()};
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
  w.addEventListener('wheel',e=>{e.preventDefault();state.ph[p].s*=e.deltaY<0?1.08:1/1.08;applyPan(p);persist()},{passive:false});
}
function avatarDataURL(p){
  const img=$('pi'+(p+1)),d=dims[p];
  if(!state.photos[p]||!img.naturalWidth||!d)return null;
  const R=6,C=AV*R,ph=state.ph[p];
  const c=document.createElement('canvas');c.width=c.height=C;
  const ctx=c.getContext('2d');
  ctx.beginPath();ctx.arc(C/2,C/2,C/2,0,Math.PI*2);ctx.clip();
  ctx.translate(C/2+ph.x*R,C/2+ph.y*R);ctx.scale(ph.s,ph.s);
  ctx.drawImage(img,-d.w*R/2,-d.h*R/2,d.w*R,d.h*R);
  return c.toDataURL('image/png');
}

/* ================= stats ================= */
const lastTop=[undefined,undefined];
function updateStats(){
  const all=allItems();
  [0,1].forEach(p=>{
    const n=p+1;
    const cnt=$('cnt'+n);if(cnt)cnt.textContent=all.filter(it=>ck(it.id)[p]).length;
    const vals={};
    TK.forEach(k=>{
      const pool=all.filter(it=>it.tr.includes(k));
      const v=pool.length?Math.round(pool.filter(it=>ck(it.id)[p]).length/pool.length*100):0;
      vals[k]=v;
      const row=$(`tr${n}-${k}`);
      row.querySelector('.tr-fill').style.width=v+'%';
      row.querySelector('.tr-v').textContent=v+'%';
    });
    const wins=AXES.map(([x,y])=>vals[x]>vals[y]?x:vals[y]>vals[x]?y:null).filter(Boolean);
    const top=wins.length?wins[0]:null;
    TK.forEach(k=>$(`tr${n}-${k}`).classList.toggle('best',wins.includes(k)));
    const bd=$('bd'+n);
    const label=wins.length?wins.map(k=>TRAITS[k].l).join(' · '):EMPTY;
    bd.classList.toggle('empty',!top);
    if(lastTop[p]!==undefined&&lastTop[p]!==label){bd.classList.remove('fade');void bd.offsetWidth;bd.classList.add('fade')}
    bd.textContent=label;
    lastTop[p]=label;
  });
  let both=0,either=0;
  all.forEach(it=>{const c=ck(it.id);if(c[0]&&c[1])both++;if(c[0]||c[1])either++});
  const sync=either?Math.round(both/either*100):null;
  $('syncNum').textContent=sync===null?'–':sync;
  $('syncPct').style.display=sync===null?'none':'inline';
  $('same').textContent=both;
}

/* gradient title for capture (html2canvas can't clip text to a gradient) */
function gradTitleURL(){
  const h=document.querySelector('.hd-t');if(!h)return null;
  const cs=getComputedStyle(h),r=h.getBoundingClientRect();
  const pr=document.createElement('span');
  pr.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
  h.appendChild(pr);const base=pr.getBoundingClientRect().top-r.top;pr.remove();
  const fs=parseFloat(cs.fontSize),tf=(V.fonts||[])[state.tfont],k=tf?tf.z/fs:1;
  const W=r.width*k,H=r.height*k,S=3;if(!W||!H)return null;
  const c=document.createElement('canvas');c.width=Math.ceil(W*S);c.height=Math.ceil(H*S);
  const ctx=c.getContext('2d');ctx.scale(S,S);
  ctx.font=`${cs.fontStyle} ${cs.fontWeight} ${fs*k}px ${cs.fontFamily}`;
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const x0=parseFloat(cs.paddingLeft)*k,tw=ctx.measureText(h.textContent).width;
  const g=ctx.createLinearGradient(x0,0,x0+tw,0);
  const rs=getComputedStyle(document.documentElement);
  g.addColorStop(0,rs.getPropertyValue('--t1').trim());g.addColorStop(1,rs.getPropertyValue('--t2').trim());
  ctx.fillStyle=g;
  ctx.fillText(h.textContent,x0,base*k);
  return {url:c.toDataURL('image/png'),w:W,h:H};
}

];
let gradReady=false;
function gradColors(){
  const g=state.grad||{mode:'auto'};
  if(g.mode==='none')return null;
  if(g.mode==='pair')return [g.a,g.b];
  return [state.colors[0],state.colors[1]];
}
function applyGrad(){
  const h=document.querySelector('.hero');if(!h)return;
  const c=gradColors();
  h.style.background=c?`linear-gradient(120deg,${rgba(c[0],.13)} 0%,${rgba(c[0],0)} 44%,${rgba(c[1],0)} 56%,${rgba(c[1],.13)} 100%)`:'transparent';
  const g=state.grad||{mode:'auto'};
  const auto=$('gAuto');if(auto)auto.style.background=`linear-gradient(135deg,${state.colors[0]},${state.colors[1]})`;
  $('pg').querySelectorAll('.gc').forEach(el=>{
    const k=el.dataset.k;
    el.classList.toggle('on',(g.mode==='auto'&&k==='auto')||(g.mode==='none'&&k==='none')||(g.mode==='pair'&&k===g.n));
  });
  const nm=$('gname');
  if(nm)nm.textContent=g.mode==='auto'?'자동':g.mode==='none'?'없음':(g.n==='custom'?'직접 고른 색':g.n);
  const ca=$('gcA'),cb=$('gcB');
  if(ca&&cb&&g.mode==='pair'){ca.value=g.a;cb.value=g.b}
  if(ca&&cb){ca.parentNode.style.background=ca.value;cb.parentNode.style.background=cb.value}
}
function setGrad(g){state.grad=g;applyGrad();persist()}
function buildGrad(){
  const w=$('pg');if(!w)return;
  const chip=(k,bg,title,fn)=>{const d=document.createElement('div');d.className='gc';d.dataset.k=k;d.title=title;if(bg)d.style.background=bg;d.onclick=fn;w.appendChild(d);return d};
  chip('auto','', '자동 (두 사람 컬러)',()=>setGrad({mode:'auto'})).id='gAuto';
  GRADS.forEach(g=>chip(g.n,`linear-gradient(135deg,${g.a},${g.b})`,g.n,()=>setGrad({mode:'pair',n:g.n,a:g.a,b:g.b})));
  chip('none','', '없음',()=>setGrad({mode:'none'})).classList.add('gc-none');
  const cu=document.createElement('div');cu.className='gcustom';
  cu.innerHTML=`<label class="gci" title="왼쪽 색"><input type="color" id="gcA" value="#FF9A8B"></label><label class="gci" title="오른쪽 색"><input type="color" id="gcB" value="#8EC5FF"></label><span class="gcl">직접</span>`;
  w.appendChild(cu);
  const upd=()=>setGrad({mode:'pair',n:'custom',a:$('gcA').value,b:$('gcB').value});
  $('gcA').addEventListener('input',upd);$('gcB').addEventListener('input',upd);
  gradReady=true;
}
const panel=$('panel');
$('colorBtn').onclick=e=>{
  e.stopPropagation();
  const on=panel.classList.toggle('open');
  $('colorBtn').classList.toggle('active',on);
};
if($('pnClose'))$('pnClose').onclick=()=>{panel.classList.remove('open');$('colorBtn').classList.remove('active')};
document.addEventListener('click',e=>{
  if(panel.classList.contains('open')&&!panel.contains(e.target)&&!$('colorBtn').contains(e.target)){
    panel.classList.remove('open');$('colorBtn').classList.remove('active');
  }
});

/* ================= title fonts ================= */
function setTitleFont(i){
  const F=V.fonts;if(!F||!F.length)return;
  if(!F[i])i=0;state.tfont=i;const f=F[i],r=document.documentElement.style;
  r.setProperty('--tf',f.f);r.setProperty('--tst',f.st);r.setProperty('--tw',f.w);r.setProperty('--tz',f.z+'px');r.setProperty('--tls',f.ls);
  const w=$('tfonts');if(w)w.querySelectorAll('.fo').forEach((b,j)=>b.classList.toggle('on',j===i));
  const n=$('fname');if(n)n.textContent=f.n;
  persist();
}
function buildTitleFonts(){
  const w=$('tfonts');if(!w||!V.fonts)return;
  V.fonts.forEach((f,i)=>{
    const b=document.createElement('button');b.className='fo';b.title=f.n;
    b.textContent='Couple';
    b.style.fontFamily=f.f;b.style.fontStyle=f.st;b.style.fontWeight=f.w;
    b.onclick=()=>setTitleFont(i);w.appendChild(b);
  });
}

/* ================= init ================= */
(function init(){
  const d=new Date();
  const de=$('date');
  if(de)de.textContent=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  buildPerson(0);buildPerson(1);
  if(V.traits)$('traits').innerHTML=V.traits();
  setColor(0,state.colors[0]);setColor(1,state.colors[1]);
  [0,1].forEach(renderPhoto);
  if(!$('themes'))state.theme=0;
  buildThemes();setTheme(state.theme);
  buildGrad();applyGrad();
  buildTitleFonts();setTitleFont(state.tfont||0);
  render();renderNames();updateStats();
})();

</script>
